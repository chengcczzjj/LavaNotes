name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Electron smoke test
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:smoke

  windows:
    # Transparency and click-through only exist on Windows: the smoke test
    # captures the screen and clicks with the real mouse there.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Electron smoke test on Windows
        run: npm run test:smoke
