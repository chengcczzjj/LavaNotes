name: Release Windows

# Push a v* tag (matching package.json) to build the installer on Windows,
# run the checks and the Electron smoke test there, and publish the GitHub
# Release that electron-updater reads. Assets go to a draft first; the release
# is published only when the installer, blockmap and latest.yml all match.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag, version and release notes
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          if [ ! -f "docs/releases/v$VERSION.md" ]; then
            echo "::error::Missing docs/releases/v$VERSION.md"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "INSTALLER=LavaNotes-Setup-$VERSION.exe" >> "$GITHUB_ENV"

      - name: Refuse to overwrite a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if IS_DRAFT=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$IS_DRAFT" = "true" ]; then
              gh release delete "$GITHUB_REF_NAME" --yes
            else
              echo "::error::Release $GITHUB_REF_NAME is already published; bump the version instead"
              exit 1
            fi
          fi

      - run: npm ci
      - run: npm test

      - name: Electron smoke test on Windows
        run: npm run test:smoke

      - name: Build installer
        run: npx electron-builder --win --x64 --publish never

      - name: Check build output
        run: |
          for FILE in "$INSTALLER" "$INSTALLER.blockmap" latest.yml; do
            [ -s "dist/$FILE" ] || { echo "::error::dist/$FILE is missing"; exit 1; }
          done
          grep -q "version: $APP_VERSION" dist/latest.yml || { echo "::error::latest.yml has the wrong version"; exit 1; }
          grep -q "path: $INSTALLER" dist/latest.yml || { echo "::error::latest.yml points at another file"; exit 1; }
          [ -d "dist/win-unpacked/resources/app.asar.unpacked/node_modules/@koromix" ] || { echo "::error::koffi native module was not unpacked"; exit 1; }

      - name: Upload to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --target "$GITHUB_SHA" \
            --title "LavaNotes $APP_VERSION" --notes-file "docs/releases/v$APP_VERSION.md" \
            "dist/$INSTALLER" "dist/$INSTALLER.blockmap" "dist/latest.yml"

      - name: Check uploaded sizes and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for FILE in "$INSTALLER" "$INSTALLER.blockmap" latest.yml; do
            LOCAL=$(stat -c %s "dist/$FILE")
            REMOTE=$(gh release view "$GITHUB_REF_NAME" --json assets --jq ".assets[] | select(.name == \"$FILE\") | .size")
            [ "$LOCAL" = "$REMOTE" ] || { echo "::error::$FILE uploaded as '$REMOTE' bytes, expected $LOCAL"; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
